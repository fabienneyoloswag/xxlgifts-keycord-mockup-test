name: Organize keycord assets

on:
  push:
    branches: [main]
    paths:
      - organize-assets.patch
      - .github/workflows/organize-assets.yml

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply asset organization
        run: |
          git apply --index organize-assets.patch
          git rm organize-assets.patch .github/workflows/organize-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Organize keycord assets by width and type"
          git push
